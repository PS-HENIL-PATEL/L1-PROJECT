# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                    Enterprise RAG OS — Docker Compose                        ║
# ║                                                                              ║
# ║  Local development stack. Run with: docker compose up -d                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  # ── RAG API Server ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: enterprise-rag-app
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./logs:/workspace/logs
      - ./vector_store:/workspace/vector_store
      - ./cache:/workspace/cache
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Qdrant Vector Database ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  qdrant_data:
